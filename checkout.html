<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediCart - Checkout</title><link rel="stylesheet" href="css/style.css"></head>
<body><header><div class="container nav"><a class="logo" href="index.html">💊 MediCart</a><nav><a href="index.html">Home</a><a href="cart.html">Cart</a></nav></div></header>
<main class="container section"><div class="checkout"><div><h1>Checkout</h1><form id="checkoutForm">

<button class="btn" type="submit">Place Demo Order</button></form></div><div id="checkoutSummary" class="summary"></div></div></main>
<footer><p>© 2026 MediCart | Demo Project</p></footer><script src="js/app.js"></script></body></html>
